
name: FastGet Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'FastGet-phase1.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build FastGet APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check ZIP File
        run: |
          if [ ! -f "FastGet-phase1.zip" ]; then
            echo "ERROR: FastGet-phase1.zip not found!"
            exit 1
          fi

      - name: Extract Android Project
        shell: bash
        run: |
          mkdir -p extracted

          unzip -q FastGet-phase1.zip -d extracted

          PROJECT_FILE=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle project not found in ZIP!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Project found at: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found!"
            exit 1
          fi

          chmod +x gradlew

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastGet-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
