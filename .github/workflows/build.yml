name: Build Anario DL

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Unzip project
        run: |
          set -e
          ZIP=$(ls *.zip | head -n 1)
          echo "Using zip: $ZIP"
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project
          if [ -f project/gradlew ]; then
            echo "ROOT=project" >> $GITHUB_ENV
            ls -la project
          elif [ -f project/AnarioDL/gradlew ]; then
            echo "ROOT=project/AnarioDL" >> $GITHUB_ENV
            ls -la project/AnarioDL
          elif [ -f project/FastGet/gradlew ]; then
            echo "ROOT=project/FastGet" >> $GITHUB_ENV
            ls -la project/FastGet
          else
            echo "gradlew not found. Contents:"
            find project -maxdepth 3 -type f
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x $ROOT/gradlew

      - name: Build release APK
        run: |
          cd $ROOT
          ./gradlew clean :app:assembleRelease --no-daemon

      - name: Prepare AnarioDL-v3.zip
        run: |
          set -e
          mkdir -p dist
          APK=$(find $ROOT/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK=$APK"
          test -f "$APK"
          cp "$APK" dist/AnarioDL-v3.apk
          cd dist
          zip -9 AnarioDL-v3.zip AnarioDL-v3.apk
          ls -lh

      - name: Upload AnarioDL-v3.zip
        uses: actions/upload-artifact@v4
        with:
          name: AnarioDL-v3
          path: dist/AnarioDL-v3.zip
          if-no-files-found: error
